<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BS Grid</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
    />
  </head>
  <body>
    <div class="container">
      <div class="row">
        <div class="col-md-4 col-sm-6 col-xs-12 bg-primary text-white p-3">
          Column 1
        </div>
        <div class="col-md-4 col-sm-6 col-xs-12 bg-success text-white p-3">
          Column 2
        </div>
        <div class="col-md-4 col-sm-6 col-xs-12 bg-danger text-white p-3">
          Column 3
        </div>
      </div>
    </div>
  </body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=, initial-scale=1.0">
    <title>Tables</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
            background-color: #888686;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin: 20px 0;
            font-size: 1rem;
            text-align: left;
        }
        th, td {
            padding: 12px 15px;
            border: 1px solid #fffcfc;
        }
        th {
            background-color: #f2f2f2;
            border: 1px solid #0f0f0f;
        }
        .dob_column {
            color: #7700ff;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <table>
      <thead>
        <tr>
            <th>First Name</th>
            <th>Last Name</th>
            <th>Email</th>
            <th>DOB</th>
            <th>Gender</th>
        </tr>
      </thead>
      <tbody>
         <tr>
            <td>John</td>
            <td>Doe</td>
            <td>john.doe@example.com</td>
            <td class="dob_column">1990-01-01</td>
            <td>Male</td>
        </tr>
        <tr>
            <td>Jane</td>
            <td>Doe</td>
            <td>jane.doe@example.com</td>
            <td class="dob_column">1990-01-01</td>
            <td>female</td>
        </tr>
        <tr>
            <td>Jill</td>
            <td>Doe</td>
            <td>jill.doe@example.com</td>
            <td class="dob_column">1870-11-21</td>
            <td>female</td>
        </tr>
        <tr>
            <td>George</td>
            <td>Doe</td>
            <td>george.doe@example.com</td>
            <td class="dob_column">2005-03-01</td>
            <td>Male</td>
        </tr>
        <tr>
            <td>James</td>
            <td>Doe</td>
            <td>james.doe@example.com</td>
            <td class="dob_column">1997-06-21</td>
            <td>Male</td>
        </tr>
      </tbody>



    </table>



</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lists</title>
</head>
<body>
    <!-- Unordered List only bullets -->
    <ul>
        <li>London</li>
        <li>Paris</li>
        <li>Tokyo</li>
    </ul>

    <!-- Ordered List is numbered -->
    <ol type="I">
        <li>Nairobi</li>
        <li>Kisumu</li>
        <li>Mombasa</li>
    </ol>

</body>
</html>

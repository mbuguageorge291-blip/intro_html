<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Registration Form</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Libre+Caslon+Condensed:ital,wght@0,400..700;1,400..700&display=swap"
      rel="stylesheet"
    />
    <style>
      body {
        font-family: "Libre Caslon Condensed", serif;
        background-color: #9e7eb5;
      }
      form {
        background-color: #f2f2f2;
        padding: 20px;
        margin: 20px auto;
        border-radius: 5px;
        border: 1px solid #09e6da;
        max-width: 400px;
      }
      label {
        display: block;
        margin-bottom: 10px;
        font-weight: bold;
      }
      .full-width {
        width: 100%;
        padding: 10px;
        margin-bottom: 20px;
        border-radius: 5px;
        border: 1px solid #ccc;
        box-sizing: border-box;
      }
      button {
        background-color: #4caf50;
        color: white;
        padding: 10px 20px;
        border: none;
        border-radius: 5px;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <form action="">
      <label for="names">Full Name:</label>
      <input
        class="full-width"
        type="text"
        required
        id="names"
        name="full_name"
        placeholder="George Mbugua"
      />
      <br />
      <label for="email">Email:</label>
      <input
        class="full-width"
        type="email"
        required
        id="email"
        name="email"
        placeholder="george.mbugua@example.com"
      />
      <br /><label for="password">Password:</label>
      <input
        class="full-width"
        type="password"
        required
        id="password"
        name="password"
        placeholder="********"
      />
      <br /><label for="confirm_password">Confirm Password:</label>
      <input
        class="full-width"
        type="password"
        required
        id="confirm_password"
        name="confirm_password"
        placeholder="********"
      />
      <br /><label for="dob">Date of Birth:</label>
      <input
        class="full-width"
        type="date"
        min="1900-01-01"
        max="2024-12-31"
        required
        id="dob"
        name="dob"
      />
      <br />
      <label for="gender">Gender:</label>
      <input type="radio" name="gender" id="male" value="male" />
      <label for="male">Male</label>
      <br /><input type="radio" name="gender" id="female" value="female" />
      <label for="female">Female</label>
      <br /><input type="radio" name="gender" id="other" value="other" />
      <label for="other">Other</label>
      <br />
      <input type="checkbox" id="x" name="food" />
      <label for="x">I love food</label>
      <br />
      <label for="county">County:</label>
      <select name="County" id="county" class="full-width">
        <option value="1">Mombasa</option>
        <option value="2">Nairobi</option>
        <option value="3">Kisumu</option>
        <option value="4">Nakuru</option>
        <option value="5">Eldoret</option>
      </select>
      <br /><button type="submit">Register</button>
    </form>
  </body>
</html>
